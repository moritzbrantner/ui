name: Format Probe

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - name: Format milestone files
        run: bun run format
      - name: Commit formatter output
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/patterns/pop-rewards.tsx \
            src/components/patterns/theme-motion.tsx \
            registry/default/ui/pop-rewards.tsx \
            registry/default/ui/theme-motion.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format Pop and Pulse milestones"
          git push origin "HEAD:$BRANCH"
