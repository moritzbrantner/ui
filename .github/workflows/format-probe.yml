name: Format Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - name: Format and print affected files
        run: |
          bun run format
          for file in \
            src/components/patterns/pop-rewards.tsx \
            src/components/patterns/theme-motion.tsx \
            registry/default/ui/pop-rewards.tsx \
            registry/default/ui/theme-motion.tsx
          do
            echo "===== BEGIN $file ====="
            cat "$file"
            echo "===== END $file ====="
          done
