name: Verify issue 30 generator

on:
  push:
    branches: [issue-30-ui-component-generator]

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-30-ui-component-generator
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: moritzbrantner/coding-tooling
          ref: main
          path: .tmp/coding-tooling
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install tooling
        working-directory: .tmp/coding-tooling
        run: bun install --frozen-lockfile
      - name: Install UI dependencies
        run: bun install --frozen-lockfile
      - name: Validate generator plans
        run: |
          TOOL="$GITHUB_WORKSPACE/.tmp/coding-tooling/src/cli.ts"
          bun "$TOOL" generate plan ui-component \
            --input name=GeneratorProbe \
            --input tier=labs \
            --input storyCategory=Layout \
            --input client=false \
            --json > /tmp/server-plan.json
          bun "$TOOL" generate plan ui-component \
            --input name=ClientProbe \
            --input tier=stable \
            --input storyCategory=Feedback \
            --input client=true \
            --json > /tmp/client-plan.json
          grep -q 'component-false.tsx.tmpl' /tmp/server-plan.json
          grep -q 'Components/Layout/Generator Probe' /tmp/server-plan.json
          grep -q 'component-true.tsx.tmpl' /tmp/client-plan.json
          grep -q 'use client' /tmp/client-plan.json
      - name: Apply generator in disposable repository copy
        run: |
          mkdir -p /tmp/ui-generator-test
          rsync -a --exclude=.git --exclude=.tmp ./ /tmp/ui-generator-test/
          cd /tmp/ui-generator-test
          TOOL="$GITHUB_WORKSPACE/.tmp/coding-tooling/src/cli.ts"
          bun "$TOOL" generate ui-component \
            --input name=GeneratorProbe \
            --input tier=labs \
            --input storyCategory=Layout \
            --input client=false \
            --json > /tmp/apply.json
          grep -q 'generated-and-verified' /tmp/apply.json
          test -f src/components/labs/generator-probe.tsx
          test -f src/components/labs/generator-probe.stories.tsx
          grep -q 'export \* from "./components/labs/generator-probe";' src/labs.ts
          grep -q 'TODO(GEN-GAP:semantic-root)' src/components/labs/generator-probe.tsx
          grep -q 'tags: \["autodocs", "test"\]' src/components/labs/generator-probe.stories.tsx
      - name: Validate repository without disposable output
        run: |
          rm -rf .tmp
          bun run format:check
          bun run check-types
          bun run lint
          bun run test:unit
      - name: Remove helper workflow
        run: |
          rm .github/workflows/issue-30-generator-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove issue 30 verification helper"
          git push origin HEAD:issue-30-ui-component-generator
