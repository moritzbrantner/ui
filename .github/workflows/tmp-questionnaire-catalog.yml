name: Temporary questionnaire catalog generation

on:
  push:
    branches:
      - feat/questionnaire-prototypes

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/questionnaire-prototypes
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Generate component catalog
        run: bun ./scripts/generate-component-catalog.ts
      - name: Commit generated catalog
        run: |
          if git diff --quiet -- docs/components.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/components.md
          git commit -m "docs(ui): regenerate component catalog"
          git push origin HEAD:feat/questionnaire-prototypes
