name: Activity calendar polish

on:
  push:
    branches:
      - feat/activity-calendar

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Polish interaction contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          component_path = Path("src/components/stable/activity-calendar.tsx")
          component = component_path.read_text()
          component = component.replace('if (key === "ArrowLeft") targetDate = addDaysToDateKey(date, -1);\n      if (key === "ArrowRight") targetDate = addDaysToDateKey(date, 1);\n      if (key === "ArrowUp") targetDate = addDaysToDateKey(date, -7);\n      if (key === "ArrowDown") targetDate = addDaysToDateKey(date, 7);', 'if (key === "ArrowLeft") targetDate = addDaysToDateKey(date, -7);\n      if (key === "ArrowRight") targetDate = addDaysToDateKey(date, 7);\n      if (key === "ArrowUp") targetDate = addDaysToDateKey(date, -1);\n      if (key === "ArrowDown") targetDate = addDaysToDateKey(date, 1);')
          component = component.replace('formatTooltip?.(day) ??', 'formatTooltip?.({ date: day.date, value: day.value, label: day.label }) ??')
          component = component.replace('onActivate={(selectedDay) => onDayClick?.(selectedDay)}', 'onActivate={({ date, value, label }) => onDayClick?.({ date, value, label })}')
          component_path.write_text(component)
          test_path = Path("src/components/stable/activity-calendar.test.tsx")
          test = test_path.read_text()
          test = test.replace('const second = screen.getByLabelText("0 activities on August 2, 2026");\n\n    fireEvent.focus(first);\n    fireEvent.keyDown(first, { key: "ArrowRight" });\n\n    expect(document.activeElement).toBe(second);', 'const nextDay = screen.getByLabelText("0 activities on August 2, 2026");\n    const nextWeek = screen.getByLabelText("0 activities on August 9, 2026");\n\n    fireEvent.focus(first);\n    fireEvent.keyDown(first, { key: "ArrowDown" });\n    expect(document.activeElement).toBe(nextDay);\n\n    fireEvent.keyDown(nextDay, { key: "ArrowRight" });\n    expect(document.activeElement).toBe(nextWeek);')
          test = test.replace('      label: "Seven completed items",\n      level: 4,\n', '      label: "Seven completed items",\n')
          test_path.write_text(test)
          PY
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format changed sources
        run: bunx oxfmt src/components/stable/activity-calendar.tsx src/components/stable/activity-calendar.test.tsx
      - name: Verify ActivityCalendar
        run: |
          bun run check-types
          bunx vitest run src/components/stable/activity-calendar.test.tsx
          bun run lint
      - name: Commit polish
        run: |
          git rm .github/workflows/activity-calendar-polish.yml
          git add src/components/stable/activity-calendar.tsx src/components/stable/activity-calendar.test.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Polish ActivityCalendar navigation"
          git push origin HEAD:feat/activity-calendar
