name: Temporary questionnaire type fix

on:
  push:
    branches:
      - feat/questionnaire-prototypes

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/questionnaire-prototypes
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - name: Resolve intrinsic results prop collision
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/components/patterns/questionnaire.tsx")
          text = path.read_text()
          old = 'export type QuestionnairePollResultsProps = Omit<React.ComponentProps<"div">, "children"> & {'
          new = 'export type QuestionnairePollResultsProps = Omit<\n  React.ComponentProps<"div">,\n  "children" | "results"\n> & {'
          if text.count(old) != 1:
              raise SystemExit(f"expected one poll result props match, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
          bunx oxfmt@0.51.0 src/components/patterns/questionnaire.tsx
      - name: Commit type fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/patterns/questionnaire.tsx
          git commit -m "fix: avoid poll results intrinsic prop collision"
          git push origin HEAD:feat/questionnaire-prototypes
