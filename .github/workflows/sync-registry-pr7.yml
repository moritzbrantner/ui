name: Sync registry for PR 7

on:
  push:
    branches:
      - work/theme-vocabulary-components

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'moritzbrantner/ui'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/theme-vocabulary-components
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - run: bun run sync:registry
      - name: Commit generated registry
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry
          git commit -m "chore: sync theme vocabulary registry"
          git push origin HEAD:work/theme-vocabulary-components
