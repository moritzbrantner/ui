name: Publish Theme Vocabularies

on:
  pull_request:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - name: Format public contract files
        run: |
          bunx oxfmt --write \
            src/components/patterns/theme-vocabularies.stories.tsx \
            src/patterns.ts src/atlas.ts src/studio.ts src/paper.ts src/scholia.ts src/zleek.ts src/pop.ts src/pulse.ts \
            src/theme-config/manifests.ts src/theme-config/manifests.test.ts src/theme-config/index.ts \
            src/theme-metadata.ts src/themes.tsx scripts/sync-registry.ts
      - name: Synchronize registry source files
        run: bun run sync:registry
      - name: Add vocabulary registry items
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("registry/default/registry.json")
          data = json.loads(path.read_text())

          def theme(name, title, description, style):
              return {
                  "name": name,
                  "type": "registry:theme",
                  "title": title,
                  "description": description,
                  "dependencies": ["tw-animate-css"],
                  "files": [
                      {"path": "styles/moritz-base.css", "type": "registry:style", "target": "@/styles/moritz-base.css"},
                      {"path": f"styles/{style}.css", "type": "registry:style", "target": f"@/styles/{style}.css"},
                  ],
              }

          def component(name, title, description, registry_dependencies, dependencies=None):
              item = {
                  "name": name,
                  "type": "registry:ui",
                  "title": title,
                  "description": description,
                  "registryDependencies": registry_dependencies,
                  "files": [{"path": f"ui/{name}.tsx", "type": "registry:ui", "target": f"@ui/{name}.tsx"}],
              }
              if dependencies:
                  item["dependencies"] = dependencies
              return item

          new_items = [
              theme("bobba-theme", "Bobba Theme", "The default product-safe Bobba theme and shared UI foundation.", "bobba"),
              theme("zleek-theme", "Zleek Theme", "The glass command-center Zleek theme with translucent shell tokens.", "zleek"),
              theme("atlas-theme", "Atlas Theme", "The dense Atlas operational dashboard theme with data and map tokens.", "atlas"),
              theme("studio-theme", "Studio Theme", "The Studio creative-tooling theme with editor and timeline tokens.", "studio"),
              theme("paper-theme", "Paper Theme", "The quiet Paper document and research theme with document tokens.", "paper"),
              component("atlas-operations", "Atlas Operations", "Dense KPI, delta, map, table, alert, and sparkline primitives for operational interfaces.", ["moritzbrantner/ui/cn", "moritzbrantner/ui/atlas-theme"]),
              component("studio-tools", "Studio Tools", "Media transport, timeline, layer, inspector, tool, and before/after primitives for creative workflows.", ["moritzbrantner/ui/cn", "moritzbrantner/ui/studio-theme"]),
              component("scholia-research", "Scholia Research", "Marginalia, citation trails, interpretation comparison, passage navigation, witness matrices, and lemma anchors.", ["moritzbrantner/ui/cn", "moritzbrantner/ui/scholia-theme"]),
              component("paper-documents", "Paper Documents", "Page, OCR, translation, outline, and annotation primitives for document workflows.", ["moritzbrantner/ui/cn", "moritzbrantner/ui/paper-theme"]),
              component("zleek-shells", "Zleek Shells", "Glass docks, command decks, status capsules, launch cards, quick switchers, and HUD panels.", ["moritzbrantner/ui/cn", "moritzbrantner/ui/zleek-theme"]),
              component("product-patterns", "Product Patterns", "Theme-agnostic settings, empty-state, form-action, inline-edit, toolbar, and resource patterns.", ["moritzbrantner/ui/cn", "moritzbrantner/ui/moritz-theme"]),
              component("pop-rewards-extended", "Extended Pop Rewards", "Achievement, streak, completion, checklist, share-success, and reaction reward primitives.", ["moritzbrantner/ui/cn", "moritzbrantner/ui/pop-theme", "moritzbrantner/ui/pop-rewards"], ["motion"]),
              component("pulse-spatial", "Pulse Spatial", "Morphing dialog, kinetic list, spatial selection, expanding card, breadcrumb, and panel-stack primitives.", ["moritzbrantner/ui/cn", "moritzbrantner/ui/pulse-theme"], ["motion"]),
          ]

          names = {item["name"] for item in new_items}
          data["items"] = [item for item in data["items"] if item.get("name") not in names] + new_items
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n")
          PY
          bunx oxfmt --write registry/default/registry.json
      - name: Verify synchronized registry
        run: bun run sync:registry --check
      - name: Commit publication
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts/sync-registry.ts registry/default
          git diff --cached --quiet || git commit -m "Publish theme vocabulary registry"
          git push origin "HEAD:$BRANCH"
