name: Foundation generated-file format

on:
  push:
    branches:
      - rollout/boring-foundation-v1

permissions:
  contents: write

jobs:
  format-generated:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - name: Format generated foundation JSON
        run: ./node_modules/.bin/oxfmt .coding-tooling.json renovate.json
      - name: Commit generated formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .coding-tooling.json renovate.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: format foundation metadata"
          git push origin HEAD
