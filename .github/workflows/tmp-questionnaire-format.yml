name: Temporary questionnaire format

on:
  push:
    branches:
      - feat/questionnaire-prototypes

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/questionnaire-prototypes
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - name: Format questionnaire files
        run: bunx oxfmt@0.51.0 src/components/patterns/questionnaire.tsx src/components/patterns/questionnaire.stories.tsx src/components/patterns/questionnaire.test.tsx
      - name: Refresh questionnaire catalog description
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/component-registry.ts")
          text = path.read_text()
          old = "State-light questionnaire shell and single-answer selector with card, list, and scale presentation modes."
          new = "Composable questionnaire shell with native choices, open-ended answers, poll results, and Pop/Pulse presentations."
          if old not in text:
              raise SystemExit("questionnaire registry description not found")
          path.write_text(text.replace(old, new, 1))
          PY
          bun run generate:components
          bunx oxfmt@0.51.0 src/component-registry.ts
      - name: Commit generated cleanup
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/patterns/questionnaire.tsx src/components/patterns/questionnaire.stories.tsx src/components/patterns/questionnaire.test.tsx src/component-registry.ts docs/components.md
          git commit -m "chore: format questionnaire batch"
          git push origin HEAD:feat/questionnaire-prototypes
