name: Type Fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - name: Narrow FlowButton children type
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path("src/components/patterns/theme-motion.tsx"),
              Path("registry/default/ui/theme-motion.tsx"),
          ]
          old = 'type FlowButtonProps = HTMLMotionProps<"button"> & VariantProps<typeof buttonVariants>;'
          new = '''type FlowButtonProps = Omit<HTMLMotionProps<"button">, "children"> &
            VariantProps<typeof buttonVariants> & {
              children?: React.ReactNode;
            };'''

          for path in paths:
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"expected FlowButtonProps declaration not found in {path}")
              path.write_text(text.replace(old, new, 1))
          PY
          bunx oxfmt --write src/components/patterns/theme-motion.tsx registry/default/ui/theme-motion.tsx
      - name: Commit type fix
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/patterns/theme-motion.tsx registry/default/ui/theme-motion.tsx
          git commit -m "Fix FlowButton children type"
          git push origin "HEAD:$BRANCH"
