name: Activity calendar bootstrap

on:
  push:
    branches:
      - feat/activity-calendar

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Implement ActivityCalendar
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          root = Path('.')
          component_dir = root / 'src/components/stable/activity-calendar'
          component_dir.mkdir(parents=True, exist_ok=True)

          (component_dir / 'model.ts').write_text(r'''const DAY_MS = 86_400_000;

export type ActivityCalendarVariant = "year" | "months" | "compact";

export type ActivityCalendarValue<TLabel = string> = {
  date: string;
  value: number;
  label?: TLabel;
};

export type ActivityCalendarModelDay<TLabel = string> = ActivityCalendarValue<TLabel> & {
  level: number;
};

export type ActivityCalendarModel<TLabel = string> = {
  startDate: string;
  endDate: string;
  levels: number;
  weeks: readonly (readonly (ActivityCalendarModelDay<TLabel> | null)[])[];
  monthLabels: ReadonlyMap<number, string>;
};

const variantDayCounts: Record<ActivityCalendarVariant, number> = {
  year: 365,
  months: 183,
  compact: 91,
};

export function buildActivityCalendarModel<TLabel>(options: {
  data: readonly ActivityCalendarValue<TLabel>[];
  startDate?: string;
  endDate?: string;
  levels: number;
  weekStartsOn: 0 | 1;
  variant: ActivityCalendarVariant;
  formatMonth: (date: Date) => string;
}): ActivityCalendarModel<TLabel> {
  const levels = clampLevels(options.levels);
  const { startDate, endDate } = resolveActivityCalendarRange(
    options.startDate,
    options.endDate,
    options.variant,
  );
  const start = parseDateKey(startDate);
  const end = parseDateKey(endDate);
  const values = normalizeValues(options.data);
  const days: ActivityCalendarModelDay<TLabel>[] = [];

  for (let current = start; current.getTime() <= end.getTime(); current = addDays(current, 1)) {
    const date = toDateKey(current);
    const entry = values.get(date);
    days.push({
      date,
      value: entry?.value ?? 0,
      label: entry?.label,
      level: 0,
    });
  }

  const maxValue = days.reduce((maximum, day) => Math.max(maximum, day.value), 0);
  const leveledDays = days.map((day) => ({
    ...day,
    level: getActivityLevel(day.value, maxValue, levels),
  }));
  const leadingDays = getLeadingDays(start, options.weekStartsOn);
  const padded: (ActivityCalendarModelDay<TLabel> | null)[] = [
    ...Array.from({ length: leadingDays }, () => null),
    ...leveledDays,
  ];

  while (padded.length % 7 !== 0) {
    padded.push(null);
  }

  const weeks = Array.from({ length: padded.length / 7 }, (_, index) =>
    padded.slice(index * 7, index * 7 + 7),
  );
  const monthLabels = new Map<number, string>();

  leveledDays.forEach((day, dayIndex) => {
    const parsed = parseDateKey(day.date);
    const weekIndex = Math.floor((leadingDays + dayIndex) / 7);

    if (dayIndex === 0 || parsed.getUTCDate() === 1) {
      monthLabels.set(weekIndex, options.formatMonth(parsed));
    }
  });

  return { startDate, endDate, levels, weeks, monthLabels };
}

export function addDaysToDateKey(date: string, amount: number) {
  return toDateKey(addDays(parseDateKey(date), amount));
}

export function isDateKeyWithinRange(date: string, startDate: string, endDate: string) {
  const timestamp = parseDateKey(date).getTime();
  return timestamp >= parseDateKey(startDate).getTime() && timestamp <= parseDateKey(endDate).getTime();
}

export function clampLevels(levels: number) {
  if (!Number.isFinite(levels)) {
    return 5;
  }

  return Math.min(5, Math.max(2, Math.round(levels)));
}

export function parseDateKey(date: string) {
  const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(date);

  if (!match) {
    throw new TypeError(`Expected a YYYY-MM-DD date, received "${date}".`);
  }

  const year = Number(match[1]);
  const month = Number(match[2]);
  const day = Number(match[3]);
  const parsed = new Date(Date.UTC(year, month - 1, day));

  if (
    parsed.getUTCFullYear() !== year ||
    parsed.getUTCMonth() !== month - 1 ||
    parsed.getUTCDate() !== day
  ) {
    throw new TypeError(`Expected a valid calendar date, received "${date}".`);
  }

  return parsed;
}

function resolveActivityCalendarRange(
  requestedStart: string | undefined,
  requestedEnd: string | undefined,
  variant: ActivityCalendarVariant,
) {
  const dayCount = variantDayCounts[variant];
  let start = requestedStart ? parseDateKey(requestedStart) : undefined;
  let end = requestedEnd ? parseDateKey(requestedEnd) : undefined;

  if (!start && !end) {
    end = parseDateKey(getTodayDateKey());
    start = addDays(end, -(dayCount - 1));
  } else if (start && !end) {
    end = addDays(start, dayCount - 1);
  } else if (!start && end) {
    start = addDays(end, -(dayCount - 1));
  }

  if (!start || !end) {
    throw new Error("Could not resolve the activity calendar date range.");
  }

  if (start.getTime() > end.getTime()) {
    [start, end] = [end, start];
  }

  return { startDate: toDateKey(start), endDate: toDateKey(end) };
}

function normalizeValues<TLabel>(data: readonly ActivityCalendarValue<TLabel>[]) {
  const values = new Map<string, ActivityCalendarValue<TLabel>>();

  for (const item of data) {
    const date = toDateKey(parseDateKey(item.date));
    const value = Number.isFinite(item.value) ? Math.max(0, item.value) : 0;
    const current = values.get(date);

    values.set(date, {
      date,
      value: (current?.value ?? 0) + value,
      label: item.label ?? current?.label,
    });
  }

  return values;
}

function getActivityLevel(value: number, maximum: number, levels: number) {
  if (value <= 0 || maximum <= 0) {
    return 0;
  }

  return Math.max(1, Math.min(levels - 1, Math.ceil((value / maximum) * (levels - 1))));
}

function getLeadingDays(start: Date, weekStartsOn: 0 | 1) {
  return (start.getUTCDay() - weekStartsOn + 7) % 7;
}

function addDays(date: Date, amount: number) {
  return new Date(date.getTime() + amount * DAY_MS);
}

function toDateKey(date: Date) {
  return date.toISOString().slice(0, 10);
}

function getTodayDateKey() {
  const today = new Date();
  const year = today.getFullYear();
  const month = String(today.getMonth() + 1).padStart(2, "0");
  const day = String(today.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}
''')

          (root / 'src/components/stable/activity-calendar.tsx').write_text(r'''"use client";

import * as React from "react";

import { cn } from "../../lib/cn";
import { Tooltip, TooltipContent, TooltipProvider, TooltipTrigger } from "./tooltip";
import {
  addDaysToDateKey,
  buildActivityCalendarModel,
  isDateKeyWithinRange,
  parseDateKey,
  type ActivityCalendarVariant,
} from "./activity-calendar/model";

type ActivityCalendarDay = {
  date: string;
  value: number;
  label?: string;
};

type ActivityCalendarLegendLabels = {
  less?: React.ReactNode;
  more?: React.ReactNode;
};

type ActivityCalendarProps = Omit<React.ComponentProps<"div">, "children"> & {
  data: readonly ActivityCalendarDay[];
  startDate?: string;
  endDate?: string;
  levels?: number;
  weekStartsOn?: 0 | 1;
  variant?: ActivityCalendarVariant;
  showMonthLabels?: boolean;
  showWeekdayLabels?: boolean;
  showLegend?: boolean;
  locale?: string | readonly string[];
  legendLabels?: ActivityCalendarLegendLabels;
  formatTooltip?: (day: ActivityCalendarDay) => React.ReactNode;
  formatValue?: (value: number) => string;
  onDayClick?: (day: ActivityCalendarDay) => void;
};

type ActivityCalendarDayCellProps = {
  day: ActivityCalendarDay & { level: number };
  active: boolean;
  levels: number;
  variant: ActivityCalendarVariant;
  ariaLabel: string;
  tooltip: React.ReactNode;
  onActivate: (day: ActivityCalendarDay) => void;
  onFocusDate: (date: string) => void;
  onMoveFocus: (date: string, key: string) => void;
  registerDay: (date: string, node: HTMLSpanElement | null) => void;
  interactive: boolean;
};

const variantCellClasses: Record<ActivityCalendarVariant, string> = {
  year: "size-10 sm:size-4",
  months: "size-10 sm:size-5",
  compact: "size-10 sm:size-6",
};

const variantSwatchClasses: Record<ActivityCalendarVariant, string> = {
  year: "size-7 sm:size-3",
  months: "size-7 sm:size-4",
  compact: "size-7 sm:size-5",
};

function ActivityCalendar({
  data,
  startDate,
  endDate,
  levels = 5,
  weekStartsOn = 0,
  variant = "year",
  showMonthLabels = variant !== "compact",
  showWeekdayLabels = variant === "year",
  showLegend = true,
  locale,
  legendLabels,
  formatTooltip,
  formatValue = defaultFormatValue,
  onDayClick,
  className,
  "aria-label": ariaLabel = "Activity calendar",
  ...props
}: ActivityCalendarProps) {
  const formatMonth = React.useMemo(
    () => new Intl.DateTimeFormat(locale, { month: "short", timeZone: "UTC" }),
    [locale],
  );
  const formatWeekday = React.useMemo(
    () => new Intl.DateTimeFormat(locale, { weekday: "short", timeZone: "UTC" }),
    [locale],
  );
  const formatDate = React.useMemo(
    () => new Intl.DateTimeFormat(locale, { dateStyle: "long", timeZone: "UTC" }),
    [locale],
  );
  const model = React.useMemo(
    () =>
      buildActivityCalendarModel({
        data,
        startDate,
        endDate,
        levels,
        weekStartsOn,
        variant,
        formatMonth: (date) => formatMonth.format(date),
      }),
    [data, endDate, formatMonth, levels, startDate, variant, weekStartsOn],
  );
  const dayRefs = React.useRef(new Map<string, HTMLSpanElement>());
  const [activeDate, setActiveDate] = React.useState(model.endDate);

  React.useEffect(() => {
    if (!isDateKeyWithinRange(activeDate, model.startDate, model.endDate)) {
      setActiveDate(model.endDate);
    }
  }, [activeDate, model.endDate, model.startDate]);

  const weekdays = React.useMemo(
    () =>
      Array.from({ length: 7 }, (_, index) => {
        const sunday = new Date(Date.UTC(2024, 0, 7));
        const offset = weekStartsOn === 0 ? index : index + 1;
        return formatWeekday.format(new Date(sunday.getTime() + offset * 86_400_000));
      }),
    [formatWeekday, weekStartsOn],
  );
  const visibleWeekdayRows = weekStartsOn === 0 ? new Set([1, 3, 5]) : new Set([0, 2, 4]);

  const registerDay = React.useCallback((date: string, node: HTMLSpanElement | null) => {
    if (node) {
      dayRefs.current.set(date, node);
    } else {
      dayRefs.current.delete(date);
    }
  }, []);

  const moveFocus = React.useCallback(
    (date: string, key: string) => {
      let targetDate: string | undefined;

      if (key === "ArrowLeft") targetDate = addDaysToDateKey(date, -1);
      if (key === "ArrowRight") targetDate = addDaysToDateKey(date, 1);
      if (key === "ArrowUp") targetDate = addDaysToDateKey(date, -7);
      if (key === "ArrowDown") targetDate = addDaysToDateKey(date, 7);

      if (!targetDate || !isDateKeyWithinRange(targetDate, model.startDate, model.endDate)) {
        return;
      }

      setActiveDate(targetDate);
      dayRefs.current.get(targetDate)?.focus();
    },
    [model.endDate, model.startDate],
  );

  return (
    <div
      data-slot="activity-calendar"
      data-variant={variant}
      data-levels={model.levels}
      aria-label={ariaLabel}
      className={cn("grid min-w-0 gap-2 text-sm", className)}
      {...props}
    >
      <TooltipProvider delayDuration={150}>
        <div
          data-slot="activity-calendar-scroll-area"
          className="min-w-0 max-w-full overflow-x-auto overscroll-x-contain pb-1"
        >
          <div data-slot="activity-calendar-layout" className="min-w-max">
            {showMonthLabels ? (
              <div
                data-slot="activity-calendar-months"
                className={cn("mb-1 flex gap-0 sm:gap-1", showWeekdayLabels && "pl-10 sm:pl-8")}
                aria-hidden="true"
              >
                {model.weeks.map((_, weekIndex) => (
                  <div
                    key={weekIndex}
                    className={cn(
                      "shrink-0 overflow-visible whitespace-nowrap text-xs text-muted-foreground",
                      variantCellClasses[variant],
                    )}
                  >
                    {model.monthLabels.get(weekIndex) ?? null}
                  </div>
                ))}
              </div>
            ) : null}

            <div data-slot="activity-calendar-body" className="flex items-start">
              {showWeekdayLabels ? (
                <div
                  data-slot="activity-calendar-weekdays"
                  className="grid w-10 shrink-0 grid-rows-7 sm:w-8"
                  aria-hidden="true"
                >
                  {weekdays.map((weekday, index) => (
                    <div
                      key={`${weekday}-${index}`}
                      className={cn(
                        "flex items-center pr-2 text-xs text-muted-foreground",
                        variantCellClasses[variant],
                      )}
                    >
                      {visibleWeekdayRows.has(index) ? weekday : null}
                    </div>
                  ))}
                </div>
              ) : null}

              <div
                data-slot="activity-calendar-grid"
                role="grid"
                aria-label={ariaLabel}
                className="flex gap-0 sm:gap-1"
              >
                {model.weeks.map((week, weekIndex) => (
                  <div
                    key={weekIndex}
                    data-slot="activity-calendar-week"
                    role="row"
                    className="grid shrink-0 grid-rows-7 gap-0 sm:gap-1"
                  >
                    {week.map((day, dayIndex) =>
                      day ? (
                        <div key={day.date} role="gridcell" data-slot="activity-calendar-gridcell">
                          <ActivityCalendarDayCell
                            day={day}
                            active={activeDate === day.date}
                            levels={model.levels}
                            variant={variant}
                            ariaLabel={day.label ?? `${formatValue(day.value)} on ${formatDate.format(parseDateKey(day.date))}`}
                            tooltip={
                              formatTooltip?.(day) ??
                              day.label ??
                              `${formatValue(day.value)} on ${formatDate.format(parseDateKey(day.date))}`
                            }
                            onActivate={(selectedDay) => onDayClick?.(selectedDay)}
                            onFocusDate={setActiveDate}
                            onMoveFocus={moveFocus}
                            registerDay={registerDay}
                            interactive={Boolean(onDayClick)}
                          />
                        </div>
                      ) : (
                        <div
                          key={`padding-${weekIndex}-${dayIndex}`}
                          data-slot="activity-calendar-padding-day"
                          aria-hidden="true"
                          className={variantCellClasses[variant]}
                        />
                      ),
                    )}
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>

        {showLegend ? (
          <div
            data-slot="activity-calendar-legend"
            className="flex min-w-0 items-center justify-end gap-1 text-xs text-muted-foreground"
            aria-label="Activity intensity"
          >
            <span>{legendLabels?.less ?? "Less"}</span>
            {Array.from({ length: model.levels }, (_, level) => (
              <span
                key={level}
                data-slot="activity-calendar-legend-swatch"
                data-level={level}
                aria-hidden="true"
                className="size-3 rounded-[3px] border border-border/40"
                style={{ backgroundColor: getActivityColor(level, model.levels) }}
              />
            ))}
            <span>{legendLabels?.more ?? "More"}</span>
          </div>
        ) : null}
      </TooltipProvider>
    </div>
  );
}

function ActivityCalendarDayCell({
  day,
  active,
  levels,
  variant,
  ariaLabel,
  tooltip,
  onActivate,
  onFocusDate,
  onMoveFocus,
  registerDay,
  interactive,
}: ActivityCalendarDayCellProps) {
  const handleKeyDown = (event: React.KeyboardEvent<HTMLSpanElement>) => {
    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(event.key)) {
      event.preventDefault();
      onMoveFocus(day.date, event.key);
      return;
    }

    if (interactive && (event.key === "Enter" || event.key === " ")) {
      event.preventDefault();
      onActivate(day);
    }
  };

  return (
    <Tooltip>
      <TooltipTrigger asChild>
        <span
          ref={(node) => registerDay(day.date, node)}
          data-slot="activity-calendar-day"
          data-date={day.date}
          data-level={day.level}
          role={interactive ? "button" : "img"}
          aria-label={ariaLabel}
          tabIndex={active ? 0 : -1}
          className={cn(
            "flex shrink-0 items-center justify-center rounded-sm outline-none focus-visible:ring-[3px] focus-visible:ring-ring/50",
            interactive && "cursor-pointer",
            variantCellClasses[variant],
          )}
          onFocus={() => onFocusDate(day.date)}
          onClick={interactive ? () => onActivate(day) : undefined}
          onKeyDown={handleKeyDown}
        >
          <span
            data-slot="activity-calendar-day-swatch"
            aria-hidden="true"
            className={cn(
              "rounded-[3px] border border-border/40 transition-[background-color]",
              variantSwatchClasses[variant],
            )}
            style={{ backgroundColor: getActivityColor(day.level, levels) }}
          />
        </span>
      </TooltipTrigger>
      <TooltipContent sideOffset={4}>{tooltip}</TooltipContent>
    </Tooltip>
  );
}

function getActivityColor(level: number, levels: number) {
  if (level <= 0) {
    return "var(--activity-calendar-empty, var(--muted))";
  }

  const intensity = Math.round(25 + (75 * level) / Math.max(1, levels - 1));
  return `color-mix(in oklab, var(--activity-calendar-color, var(--chart-1)) ${intensity}%, var(--activity-calendar-empty, var(--muted)))`;
}

function defaultFormatValue(value: number) {
  return `${value} ${value === 1 ? "activity" : "activities"}`;
}

export { ActivityCalendar };
export type {
  ActivityCalendarDay,
  ActivityCalendarLegendLabels,
  ActivityCalendarProps,
  ActivityCalendarVariant,
};
''')

          (root / 'src/components/stable/activity-calendar.stories.tsx').write_text(r'''import type { Meta, StoryObj } from "@storybook/react-vite";
import { expect } from "storybook/test";

import { ActivityCalendar, type ActivityCalendarDay } from "./activity-calendar";

const data = createFixture("2025-09-01", "2026-08-31");

const meta = {
  title: "Components/Data Display/Activity Calendar",
  component: ActivityCalendar,
  tags: ["autodocs", "test"],
  args: {
    data,
    startDate: "2025-09-01",
    endDate: "2026-08-31",
  },
  render: (args) => (
    <div className="w-[calc(100vw-2rem)] max-w-5xl min-w-0">
      <ActivityCalendar {...args} />
    </div>
  ),
} satisfies Meta<typeof ActivityCalendar>;

export default meta;

type Story = StoryObj<typeof meta>;

export const Default: Story = {
  play: async ({ canvas }) => {
    await expect(canvas.getByRole("grid", { name: "Activity calendar" })).toBeVisible();
    await expect(canvas.getByText("Sep")).toBeVisible();
    await expect(canvas.getByText("Less")).toBeVisible();
    await expect(canvas.getByText("More")).toBeVisible();
  },
};

export const Months: Story = {
  args: {
    variant: "months",
    startDate: "2026-03-01",
    endDate: "2026-08-31",
    showWeekdayLabels: true,
  },
};

export const Compact: Story = {
  args: {
    variant: "compact",
    startDate: "2026-06-01",
    endDate: "2026-08-31",
  },
};

function createFixture(startDate: string, endDate: string): ActivityCalendarDay[] {
  const start = Date.parse(`${startDate}T00:00:00Z`);
  const end = Date.parse(`${endDate}T00:00:00Z`);
  const dayMs = 86_400_000;
  const fixture: ActivityCalendarDay[] = [];

  for (let timestamp = start, index = 0; timestamp <= end; timestamp += dayMs, index += 1) {
    const date = new Date(timestamp).toISOString().slice(0, 10);
    const active = index % 9 !== 0 && index % 13 !== 0;
    fixture.push({ date, value: active ? (index * 7 + index % 11) % 18 : 0 });
  }

  return fixture;
}
''')

          (root / 'src/components/stable/activity-calendar.test.tsx').write_text(r'''import { fireEvent, render, screen } from "@testing-library/react";
import { describe, expect, test, vi } from "vitest";

import { ActivityCalendar } from "./activity-calendar";

describe("activity calendar", () => {
  test("renders a date-indexed intensity calendar with generic labels", () => {
    render(
      <ActivityCalendar
        data={[
          { date: "2026-08-03", value: 5 },
          { date: "2026-08-04", value: 10 },
        ]}
        startDate="2026-08-01"
        endDate="2026-08-14"
      />,
    );

    expect(screen.getByRole("grid", { name: "Activity calendar" })).toBeTruthy();
    expect(screen.getByText("Aug")).toBeTruthy();
    expect(screen.getByLabelText("5 activities on August 3, 2026").getAttribute("data-level")).toBe(
      "2",
    );
    expect(screen.getByLabelText("10 activities on August 4, 2026").getAttribute("data-level")).toBe(
      "4",
    );
  });

  test("combines duplicate dates before calculating intensity", () => {
    render(
      <ActivityCalendar
        data={[
          { date: "2026-08-03", value: 2 },
          { date: "2026-08-03", value: 3 },
        ]}
        startDate="2026-08-03"
        endDate="2026-08-03"
      />,
    );

    expect(screen.getByLabelText("5 activities on August 3, 2026")).toBeTruthy();
  });

  test("supports arrow-key navigation between days", () => {
    render(
      <ActivityCalendar
        data={[]}
        startDate="2026-08-01"
        endDate="2026-08-14"
        showMonthLabels={false}
        showWeekdayLabels={false}
      />,
    );

    const first = screen.getByLabelText("0 activities on August 1, 2026");
    const second = screen.getByLabelText("0 activities on August 2, 2026");

    fireEvent.focus(first);
    fireEvent.keyDown(first, { key: "ArrowRight" });

    expect(document.activeElement).toBe(second);
  });

  test("activates days without embedding product-specific activity semantics", () => {
    const onDayClick = vi.fn();

    render(
      <ActivityCalendar
        data={[{ date: "2026-08-03", value: 7, label: "Seven completed items" }]}
        startDate="2026-08-03"
        endDate="2026-08-03"
        onDayClick={onDayClick}
      />,
    );

    fireEvent.click(screen.getByRole("button", { name: "Seven completed items" }));

    expect(onDayClick).toHaveBeenCalledWith({
      date: "2026-08-03",
      value: 7,
      label: "Seven completed items",
      level: 4,
    });
  });

  test("supports presentation variants and custom value formatting", () => {
    render(
      <ActivityCalendar
        data={[{ date: "2026-08-03", value: 1 }]}
        startDate="2026-08-03"
        endDate="2026-08-03"
        variant="compact"
        formatValue={(value) => `${value} contribution`}
      />,
    );

    expect(screen.getByLabelText("1 contribution on August 3, 2026")).toBeTruthy();
    expect(document.querySelector('[data-slot="activity-calendar"]')?.getAttribute("data-variant")).toBe(
      "compact",
    );
  });
});
''')

