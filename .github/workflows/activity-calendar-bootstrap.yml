name: Activity calendar bootstrap

on:
  push:
    branches:
      - feat/activity-calendar

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Generate ActivityCalendar sources
        run: python3 scripts/bootstrap-activity-calendar.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format changed sources
        run: |
          bunx oxfmt \
            src/components/stable/activity-calendar.tsx \
            src/components/stable/activity-calendar/model.ts \
            src/components/stable/activity-calendar.stories.tsx \
            src/components/stable/activity-calendar.test.tsx \
            src/stable.ts \
            src/component-registry.ts
      - name: Generate component catalog
        run: bun run generate:components
      - name: Check types
        run: bun run check-types
      - name: Run ActivityCalendar tests
        run: bunx vitest run src/components/stable/activity-calendar.test.tsx
      - name: Run repository lint checks
        run: bun run lint
      - name: Commit implementation
        run: |
          git rm .github/workflows/activity-calendar-bootstrap.yml scripts/bootstrap-activity-calendar.py
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add ActivityCalendar component"
          git push origin HEAD:feat/activity-calendar
