name: Prepare reorderable list branch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'feat/reorderable-list'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/reorderable-list
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - run: bun add @dnd-kit/react@^0.5.0
      - name: Register component
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/component-registry.ts")
          text = path.read_text()
          if 'name: "reorderable-list"' not in text:
              needle = '  {\n    name: "resource-list",'
              entry = '''  {
            name: "reorderable-list",
            fileName: "reorderable-list",
            tier: "data",
            rootExport: false,
            publicSubpath: "@moritzbrantner/ui/components/data/reorderable-list",
            storyFiles: ["src/components/data/reorderable-list.stories.tsx"],
            testFiles: ["src/components/data/reorderable-list.test.tsx"],
            status: "data",
            reason: "Reusable state-light data surface available through the data API.",
          },
          '''
              if needle not in text:
                  raise SystemExit("resource-list registry anchor not found")
              text = text.replace(needle, entry + needle, 1)
              path.write_text(text)
          PY
      - run: bun run generate:components
      - run: bun run format
      - run: bun run check-types
      - run: bun run test:unit
      - run: bun run lint
      - name: Commit prepared branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock src/data.ts src/component-registry.ts docs/components.md docs/reorderable-list.md src/components/data/reorderable-list.tsx src/components/data/reorderable-list.test.tsx src/components/data/reorderable-list.stories.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Register reorderable list"
            git push origin HEAD:feat/reorderable-list
          fi
