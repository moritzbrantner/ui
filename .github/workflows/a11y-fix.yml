name: A11y Fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - name: Improve SuccessPop description contrast
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path("src/components/patterns/pop-rewards.tsx"),
              Path("registry/default/ui/pop-rewards.tsx"),
          ]
          old = 'className="mt-0.5 text-sm text-muted-foreground"'
          new = 'className="mt-0.5 text-sm text-foreground"'

          for path in paths:
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected one SuccessPop description class in {path}")
              path.write_text(text.replace(old, new, 1))
          PY
          bunx oxfmt --write src/components/patterns/pop-rewards.tsx registry/default/ui/pop-rewards.tsx
      - name: Commit contrast fix
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/patterns/pop-rewards.tsx registry/default/ui/pop-rewards.tsx
          git commit -m "Improve SuccessPop description contrast"
          git push origin "HEAD:$BRANCH"
