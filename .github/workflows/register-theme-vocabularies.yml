name: Register Theme Vocabularies

on:
  pull_request:

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - name: Register pattern modules
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/component-registry.ts")
          text = path.read_text()
          marker = "] as const satisfies readonly ComponentRegistryEntry[];"
          if marker not in text:
              raise SystemExit("component registry terminator not found")

          names = [
              "atlas-operations",
              "studio-tools",
              "scholia-research",
              "paper-documents",
              "zleek-shells",
              "product-patterns",
              "pop-rewards-extended",
              "pulse-spatial",
          ]
          if any(f'name: "{name}"' in text for name in names):
              raise SystemExit("theme vocabulary registry entries already exist")

          story = "src/components/patterns/theme-vocabularies.stories.tsx"
          test = "src/components/patterns/theme-vocabularies.test.tsx"
          reasons = {
              "atlas-operations": "Atlas-owned operational data vocabulary for dense dashboard workflows.",
              "studio-tools": "Studio-owned creative tooling vocabulary for media and editing workflows.",
              "scholia-research": "Scholia-owned scholarly research vocabulary for source-first workbenches.",
              "paper-documents": "Paper-owned document vocabulary for reading, OCR, translation, and annotation.",
              "zleek-shells": "Zleek-owned glass shell vocabulary for polished command-center surfaces.",
              "product-patterns": "Theme-agnostic reusable product patterns with Bobba as the default expression.",
              "pop-rewards-extended": "Pop-owned extended reward vocabulary for earned positive outcomes.",
              "pulse-spatial": "Pulse-owned spatial vocabulary for continuous state-to-state movement.",
          }

          entries = []
          for name in names:
              entries.append(f'''  {{
            name: "{name}",
            fileName: "{name}",
            tier: "patterns",
            rootExport: true,
            publicSubpath: "@moritzbrantner/ui/components/patterns/{name}",
            storyFiles: ["{story}"],
            testFiles: ["{test}"],
            status: "pattern",
            reason: "{reasons[name]}",
          }},
          ''')

          text = text.replace(marker, "".join(entries) + marker)
          path.write_text(text)
          PY
          bunx oxfmt --write src/component-registry.ts
          bun run generate:components
          bunx oxfmt --write docs/components.md
      - name: Verify design-system registry
        run: bun ./scripts/verify-design-system.ts && bun run verify:component-catalog
      - name: Commit registry catalog
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/component-registry.ts docs/components.md
          git diff --cached --quiet || git commit -m "Register theme vocabulary components"
          git push origin "HEAD:$BRANCH"
