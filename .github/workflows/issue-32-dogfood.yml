name: Dogfood local generators

on:
  push:
    branches: [issue-32-dogfood-generators]

permissions:
  contents: write

jobs:
  dogfood:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-32-dogfood-generators
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install UI dependencies
        run: bun install --frozen-lockfile
      - uses: actions/checkout@v4
        with:
          repository: moritzbrantner/coding-tooling
          ref: main
          path: .tmp/coding-tooling
      - name: Install tooling
        working-directory: .tmp/coding-tooling
        run: bun install --frozen-lockfile
      - name: Move tooling outside repository and normalize stack
        run: |
          rm -rf /tmp/coding-tooling
          mv .tmp/coding-tooling /tmp/coding-tooling
          rmdir .tmp
          rm -f .github/workflows/issue-31-generator-verify.yml
          bun run format
      - name: Generate VisuallyHidden source and story
        run: |
          TOOL=/tmp/coding-tooling/src/cli.ts
          bun "$TOOL" generate ui-component \
            --input name=VisuallyHidden \
            --input tier=stable \
            --input storyCategory=Layout \
            --input client=false \
            --json | tee /tmp/component-generation.json
          grep -q 'generated-and-verified' /tmp/component-generation.json
          grep -q 'TODO(GEN-GAP:semantic-root)' src/components/stable/visually-hidden.tsx
          grep -q 'tags: \["autodocs", "test"\]' src/components/stable/visually-hidden.stories.tsx
          grep -q 'export \* from "./components/stable/visually-hidden";' src/stable.ts
      - name: Generate behavioral test scaffold
        run: |
          TOOL=/tmp/coding-tooling/src/cli.ts
          bun "$TOOL" generate ui-component-test \
            --input name=VisuallyHidden \
            --input tier=stable \
            --json | tee /tmp/test-generation.json
          grep -q 'generated-and-verified' /tmp/test-generation.json
          grep -q 'TODO(GEN-GAP:test-behavior)' src/components/stable/visually-hidden.test.tsx
      - name: Resolve semantic gaps and register component
        shell: python
        run: |
          from pathlib import Path

          Path("src/components/stable/visually-hidden.tsx").write_text('''import * as React from "react";

          import { cn } from "../../lib/cn";

          function VisuallyHidden({ className, ...props }: React.ComponentProps<"span">) {
            return (
              <span data-slot="visually-hidden" className={cn("sr-only", className)} {...props} />
            );
          }

          export { VisuallyHidden };

          export type VisuallyHiddenProps = React.ComponentProps<typeof VisuallyHidden>;
          ''')

          Path("src/components/stable/visually-hidden.stories.tsx").write_text('''import type { Meta, StoryObj } from "@storybook/react-vite";
          import { expect } from "storybook/test";

          import { VisuallyHidden } from "./visually-hidden";

          const meta = {
            title: "Components/Layout/Visually Hidden",
            component: VisuallyHidden,
            tags: ["autodocs", "test"],
          } satisfies Meta<typeof VisuallyHidden>;

          export default meta;

          type Story = StoryObj<typeof meta>;

          export const AccessibleButtonLabel: Story = {
            render: () => (
              <button type="button">
                <span aria-hidden="true">?</span>
                <VisuallyHidden>Help</VisuallyHidden>
              </button>
            ),
            play: async ({ canvas }) => {
              await expect(canvas.getByRole("button", { name: "Help" })).toBeVisible();
            },
          };
          ''')

          Path("src/components/stable/visually-hidden.test.tsx").write_text('''import { render, screen } from "@testing-library/react";
          import { describe, expect, test } from "vitest";

          import { VisuallyHidden } from "./visually-hidden";

          describe("Visually Hidden", () => {
            test("keeps accessible content in the DOM while applying screen-reader-only styling", () => {
              render(
                <VisuallyHidden className="custom-hidden" aria-live="polite">
                  Screen reader label
                </VisuallyHidden>,
              );

              const element = screen.getByText("Screen reader label");
              expect(element.tagName).toBe("SPAN");
              expect(element.className.split(/\\s+/)).toEqual(
                expect.arrayContaining(["sr-only", "custom-hidden"]),
              );
              expect(element.getAttribute("aria-live")).toBe("polite");
              expect(element.getAttribute("data-slot")).toBe("visually-hidden");
            });
          });
          ''')

          registry = Path("src/component-registry.ts")
          text = registry.read_text()
          if 'name: "visually-hidden"' in text:
              raise SystemExit("visually-hidden registry entry already exists")
          first_pattern = text.index('    tier: "patterns",')
          block_start = text.rfind("  {\n", 0, first_pattern)
          if block_start < 0:
              raise SystemExit("could not locate first patterns registry entry")
          entry = '''  {
            name: "visually-hidden",
            fileName: "visually-hidden",
            tier: "stable",
            rootExport: true,
            publicSubpath: "@moritzbrantner/ui/components/stable/visually-hidden",
            storyFiles: ["src/components/stable/visually-hidden.stories.tsx"],
            testFiles: ["src/components/stable/visually-hidden.test.tsx"],
            status: "stable",
            reason: "Reusable primitive or low-level control with stable support.",
          },
          '''
          registry.write_text(text[:block_start] + entry + text[block_start:])

          docs = Path("docs/generators.md")
          text = docs.read_text()
          text += '''

          ## Production dogfood: `VisuallyHidden`

          The first real component created through both local generators is `VisuallyHidden` in the stable tier. `ui-component` created the source, tested Storybook surface, and stable barrel export. `ui-component-test` then created a separate behavioral test scaffold after its exact source-file prerequisite passed.

          The generated semantic gaps behaved as intended: the implementing agent replaced the placeholder `div` with a `span`, added the stable `sr-only` contract, and replaced the pending test with assertions for semantic element choice, class merging, DOM-prop forwarding, and the `data-slot` contract. The Storybook scaffold was also refined into an accessible button-label example rather than leaving an empty-looking hidden-only canvas.

          Two boundaries were confirmed rather than automated away. `componentRegistry` metadata remains semantic because tier status, rationale, and evidence are maintenance decisions; it was added after the component contract was resolved. Shadcn source-registry promotion remains a separate lifecycle decision and was not performed.

          One performance friction remains: the `ui-component-test` `test:unit` postcondition currently executes the repository-wide unit suite because postconditions cannot yet target only the generated test file. That is acceptable for this first adoption but is a candidate for a later, separately justified focused-check capability rather than a reason to add arbitrary command execution to generators.
          '''
          docs.write_text(text)
      - name: Regenerate catalog and validate
        run: |
          bun run generate:components
          bun run format
          bun run format:check
          bun run check-types
          bun run lint
          bun run test:unit
          bun run build
      - name: Commit dogfood result and remove helper workflow
        run: |
          rm .github/workflows/issue-32-dogfood.yml
          rm -f .github/workflows/issue-31-generator-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: dogfood generators with visually hidden primitive"
          git push origin HEAD:issue-32-dogfood-generators
