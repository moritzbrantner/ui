name: Prepare refresh control branch

on:
  push:
    branches:
      - feat/refresh-control
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.head_ref == 'feat/refresh-control')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/refresh-control
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - name: Register component
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/component-registry.ts")
          text = path.read_text()
          if 'name: "refresh-control"' not in text:
              needle = '  {\n    name: "resource-list",'
              entry = '''  {
            name: "refresh-control",
            fileName: "refresh-control",
            tier: "data",
            rootExport: false,
            publicSubpath: "@moritzbrantner/ui/components/data/refresh-control",
            storyFiles: ["src/components/data/refresh-control.stories.tsx"],
            testFiles: ["src/components/data/refresh-control.test.tsx"],
            status: "data",
            reason: "Reusable state-light data surface available through the data API.",
          },
          '''
              if needle not in text:
                  raise SystemExit("resource-list registry anchor not found")
              text = text.replace(needle, entry + needle, 1)
              path.write_text(text)
          PY
      - run: bun run generate:components
      - run: bun run format
      - run: bun run check-types
      - run: bun run test:unit
      - run: bun run lint
      - name: Commit generated metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/data/refresh-control.tsx src/components/data/refresh-control.test.tsx src/components/data/refresh-control.stories.tsx src/data.ts src/component-registry.ts docs/components.md
          if ! git diff --cached --quiet; then
            git commit -m "Register refresh control"
            git push origin HEAD:feat/refresh-control
          fi
