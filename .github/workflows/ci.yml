name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  findings:
    name: Deterministic Findings
    permissions:
      contents: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/coding-tooling-validation.yml@159701da0842f885d786fc8109c1de32f7dc0128
    with:
      operation: findings
      report_path: .artifacts/coding-tooling/findings.json

  fast-validation:
    name: Fast Validation
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/fast-validation.yml@workflow-standard-v1.2
    with:
      format_command: bun run format:check
      lint_command: bun run lint
      typecheck_command: bun run check-types
      build_command: bun run build
      unit_test_command: bun run test:unit
      timeout_minutes: 30

  integration-validation:
    name: Integration Validation
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/integration-validation.yml@workflow-standard-v1.2
    with:
      integration_command: bun run test:coverage
      package_check_command: bun run build && bun run test:package && bun run verify:consumer && bun run verify:git-install && bun run pack:dry
      timeout_minutes: 45

  storybook-validation:
    name: Storybook Validation
    needs:
      - fast-validation
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/storybook-validation.yml@workflow-standard-v1.2
    with:
      pre_command: bunx playwright install chromium
      storybook_build_command: bun run build-storybook
      storybook_test_command: bun run test:storybook
      visual_command: bun run verify:consumer:editor && bun run test:visual && bun run test:mobile-usability
      timeout_minutes: 60
      artifact_paths: |
        storybook-static
        playwright-report
        test-results

  performance-validation:
    name: Performance Validation
    needs:
      - fast-validation
      - integration-validation
      - storybook-validation
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/performance-validation.yml@workflow-standard-v1.2
    with:
      pre_command: bunx playwright install chromium
      build_command: bun run build
      unlighthouse_command: bun run test:unlighthouse
      benchmark_command: bun run bench && bun run test:style-performance
      bundle_size_command: bun run verify:size && bun run test:size-evidence
      timeout_minutes: 75
      upload_artifacts_on: always
      artifact_paths: |
        unlighthouse-report
        .unlighthouse
        benchmark-results
        performance-results
