name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-pr7-a11y:
    name: Fix PR7 Accessibility
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'work/theme-vocabulary-components'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - name: Repair accessibility semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/patterns/atlas-operations.tsx")
          text = path.read_text()
          old = '''          <dd className="flex min-w-0 items-baseline justify-between gap-2">
            <span className="truncate text-lg font-semibold tabular-nums">{item.value}</span>
            {item.delta ? (
              <span
                className={cn(
                  "shrink-0 text-xs font-medium tabular-nums",
                  toneClassNames[item.tone ?? "neutral"],
                )}
              >
                {item.delta}
              </span>
            ) : null}
          </dd>
          {item.meta ? (
            <div className="truncate text-xs text-muted-foreground">{item.meta}</div>
          ) : null}'''
          new = '''          <dd className="grid min-w-0 gap-1">
            <span className="flex min-w-0 items-baseline justify-between gap-2">
              <span className="truncate text-lg font-semibold tabular-nums">{item.value}</span>
              {item.delta ? (
                <span
                  className={cn(
                    "shrink-0 text-xs font-medium tabular-nums",
                    toneClassNames[item.tone ?? "neutral"],
                  )}
                >
                  {item.delta}
                </span>
              ) : null}
            </span>
            {item.meta ? (
              <span className="truncate text-xs text-muted-foreground">{item.meta}</span>
            ) : null}
          </dd>'''
          if old in text:
              path.write_text(text.replace(old, new))

          path = Path("src/components/patterns/paper-documents.tsx")
          text = path.read_text()
          text = text.replace(
              '<h3 className="text-xs font-semibold uppercase tracking-wide text-muted-foreground">\n          {sourceLanguage}\n        </h3>',
              '<div className="text-xs font-semibold uppercase tracking-wide text-muted-foreground">\n          {sourceLanguage}\n        </div>',
          )
          text = text.replace(
              '<h3 className="text-xs font-semibold uppercase tracking-wide text-muted-foreground">\n          {translationLanguage}\n        </h3>',
              '<div className="text-xs font-semibold uppercase tracking-wide text-muted-foreground">\n          {translationLanguage}\n        </div>',
          )
          path.write_text(text)

          path = Path("src/components/patterns/pop-rewards-extended.tsx")
          text = path.read_text()
          old = '''      role="progressbar"
      aria-valuemin={0}
      aria-valuemax={safeMax}
      aria-valuenow={clamped}'''
          new = '''      role="progressbar"
      aria-label={typeof label === "string" ? label : "Completion"}
      aria-valuemin={0}
      aria-valuemax={safeMax}
      aria-valuenow={clamped}
      aria-valuetext={`${percentage}% complete`}'''
          if old in text:
              text = text.replace(old, new)
          text = text.replace(
              'className="text-xs font-semibold uppercase tracking-wide text-[var(--success)]"',
              'className="text-xs font-semibold uppercase tracking-wide text-foreground"',
          )
          path.write_text(text)
          PY
          bunx oxfmt --write \
            src/components/patterns/atlas-operations.tsx \
            src/components/patterns/paper-documents.tsx \
            src/components/patterns/pop-rewards-extended.tsx
          bun run sync:registry
      - name: Commit repair
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/patterns/atlas-operations.tsx \
            src/components/patterns/paper-documents.tsx \
            src/components/patterns/pop-rewards-extended.tsx \
            registry/default/ui/atlas-operations.tsx \
            registry/default/ui/paper-documents.tsx \
            registry/default/ui/pop-rewards-extended.tsx
          git diff --cached --quiet || git commit -m "Fix theme vocabulary accessibility semantics"
          git push origin "HEAD:$BRANCH"

  fast-validation:
    name: Fast Validation
    needs:
      - fix-pr7-a11y
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/fast-validation.yml@workflow-standard-v1.2
    with:
      format_command: bun run format:check
      lint_command: bun run lint
      typecheck_command: bun run check-types
      build_command: bun run build
      unit_test_command: bun run test:unit
      timeout_minutes: 30
    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

  integration-validation:
    name: Integration Validation
    needs:
      - fix-pr7-a11y
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/integration-validation.yml@workflow-standard-v1.2
    with:
      integration_command: bun run test:coverage
      package_check_command: bun run build && bun run test:package && bun run verify:consumer && bun run pack:dry
      timeout_minutes: 45
    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

  storybook-validation:
    name: Storybook Validation
    needs:
      - fast-validation
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/storybook-validation.yml@workflow-standard-v1.2
    with:
      pre_command: bunx playwright install chromium
      storybook_build_command: bun run build-storybook
      storybook_test_command: bun run test:storybook
      visual_command: bun run test:visual && bun run test:mobile-usability
      timeout_minutes: 60
      artifact_paths: |
        storybook-static
        playwright-report
        test-results
    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

  performance-validation:
    name: Performance Validation
    needs:
      - fast-validation
      - integration-validation
      - storybook-validation
    permissions:
      contents: read
      packages: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/performance-validation.yml@workflow-standard-v1.2
    with:
      pre_command: bunx playwright install chromium
      build_command: bun run build
      unlighthouse_command: bun run test:unlighthouse
      benchmark_command: bun run bench
      bundle_size_command: bun run verify:build-size
      timeout_minutes: 75
      artifact_paths: |
        unlighthouse-report
        .unlighthouse
        benchmark-results
        performance-results
    secrets:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
